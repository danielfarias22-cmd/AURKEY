<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070A10">
<meta name="description" content="Demanda IQ — inteligência preditiva de demanda para motoristas de aplicativo em Porto Alegre. Saiba onde estar, a que horas e por quê.">
<title>Demanda IQ — Inteligência de Demanda para Motoristas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070A10'/%3E%3Cpath d='M28 66 L44 34 L52 52 L62 30 L74 66' stroke='%23F5C518' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#070A10;
    --bg-1:#0B111B;
    --bg-2:#101827;
    --bg-3:#141F30;
    --border:#1B2536;
    --border-soft:#141C2A;
    --text-primary:#F5F7FA;
    --text-secondary:#93A0B4;
    --text-tertiary:#5A6579;
    --accent:#F5C518;
    --accent-ink:#1A1400;
    --blue:#3B82F6;
    --amber:#F5C518;
    --orange:#F97316;
    --red:#EF4444;
    --purple:#A78BFA;
    --green:#22C55E;
    --radius-sm:10px;
    --radius-md:12px;
    --radius-lg:14px;
    --font-sans:'Inter',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
    --nav-h:78px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg-0);
    color:var(--text-primary);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed;inset:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(245,197,24,.05), transparent 60%),
      radial-gradient(800px 500px at 90% 10%, rgba(59,130,246,.05), transparent 55%);
    pointer-events:none;z-index:0;
  }
  #root{position:relative;z-index:1;max-width:620px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg-0)}
  ::selection{background:rgba(245,197,24,.3)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  a{color:inherit}

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}

  /* ===== TOPO ===== */
  .topbar{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;
    background:rgba(7,10,16,.86);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border-soft);
  }
  .brand{display:flex;align-items:center;gap:9px}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(160deg,#1a2333,#0c121c);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand-name{font-weight:900;font-size:15px;letter-spacing:-0.01em}
  .brand-name b{color:var(--accent)}
  .brand-sub{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;color:var(--text-tertiary);text-transform:uppercase;margin-top:1px}
  .topbar-right{display:flex;align-items:center;gap:8px}
  .clock{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);letter-spacing:.02em;min-width:52px;text-align:right}
  .icon-btn{width:34px;height:34px;border-radius:10px;background:var(--bg-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:transform .12s ease,color .12s ease,border-color .12s ease}
  .icon-btn:active{transform:scale(.92)}
  .icon-btn.spinning svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .demo-toggle{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:var(--bg-2);color:var(--text-tertiary);display:flex;align-items:center;gap:5px}
  .demo-toggle.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}

  .sync-row{padding:8px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sync-status{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--text-tertiary)}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
  .badge-demo{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);padding:3px 8px;border-radius:6px}

  /* ===== CONTEÚDO ===== */
  .content{flex:1;padding:16px 16px calc(var(--nav-h) + 24px);display:flex;flex-direction:column;gap:14px}

  /* ===== CARD BASE ===== */
  .card{
    background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px;
    position:relative;
    overflow:hidden;
  }
  .card-featured{border-color:rgba(245,197,24,.35);box-shadow:0 0 0 1px rgba(245,197,24,.08) inset}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .card-title-group{display:flex;align-items:center;gap:9px}
  .card-icon{width:32px;height:32px;border-radius:9px;background:var(--bg-3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .label{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-tertiary);font-weight:600}
  .card-title{font-size:14px;font-weight:700;color:var(--text-primary);margin-top:1px}
  .value-xl{font-size:36px;font-weight:900;letter-spacing:-0.02em;line-height:1}
  .value-lg{font-size:22px;font-weight:800;letter-spacing:-0.01em;line-height:1.1}

  /* ===== BADGES / PÍLULAS ===== */
  .badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;line-height:1.4}
  .badge-neutral{background:var(--bg-3);border:1px solid var(--border);color:var(--text-secondary)}
  .badge-baixa{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:#8CB6FF}
  .badge-media{background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.35);color:var(--accent)}
  .badge-alta{background:rgba(249,115,22,.14);border:1px solid rgba(249,115,22,.4);color:#FFA85C}
  .badge-explosiva{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.45);color:#FF8A8A}
  .badge-concurso{background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.4);color:#C6B6FF}
  .badge-green{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:#6EE29A}

  /* ===== BOTÕES ===== */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:var(--radius-md);font-weight:800;font-size:14.5px;letter-spacing:-0.01em;transition:transform .12s ease,opacity .12s ease}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:linear-gradient(180deg,#FFD84D,var(--accent));color:var(--accent-ink);box-shadow:0 6px 18px rgba(245,197,24,.22)}
  .btn-secondary{background:var(--bg-3);border:1px solid var(--border);color:var(--text-primary)}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-secondary)}
  .btn-block{width:100%}
  .btn-sm{min-height:38px;font-size:12.5px;padding:0 14px}

  /* ===== NAV INFERIOR ===== */
  .bottom-nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:620px;height:var(--nav-h);
    background:rgba(9,13,20,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--border-soft);
    display:flex;align-items:center;
    padding-bottom:env(safe-area-inset-bottom);
    z-index:50;
  }
  .nav-item{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-tertiary);position:relative}
  .nav-item.active{color:var(--accent)}
  .nav-item span{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
  .nav-lock{position:absolute;top:10px;right:calc(50% - 30px);width:14px;height:14px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg-0)}
  .nav-indicator{position:absolute;top:0;height:2px;width:28px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px rgba(245,197,24,.6)}

  /* ===== CLIMA ===== */
  .weather-row{display:flex;align-items:center;gap:16px}
  .weather-icon{width:56px;height:56px;flex-shrink:0}
  .weather-impact{margin-top:12px;padding:12px 14px;border-radius:var(--radius-sm);background:rgba(245,197,24,.07);border:1px solid rgba(245,197,24,.22);font-size:13px;color:#F3E5AE;line-height:1.5;display:flex;gap:9px;align-items:flex-start}

  /* ===== RANKING BAIRROS ===== */
  .rank-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border-soft)}
  .rank-item:first-child{border-top:none;padding-top:2px}
  .rank-num{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0}
  .rank-num-1{background:linear-gradient(160deg,#FFD84D,var(--accent));color:var(--accent-ink)}
  .rank-num-2{background:var(--bg-3);border:1px solid var(--border);color:var(--text-secondary)}
  .rank-num-3{background:var(--bg-3);border:1px solid var(--border);color:var(--text-tertiary)}
  .rank-body{flex:1;min-width:0}
  .rank-name{font-weight:800;font-size:14.5px;letter-spacing:-0.01em}
  .rank-reason{font-size:12px;color:var(--text-secondary);margin-top:2px;line-height:1.4}
  .stars{display:flex;gap:2px;margin-top:5px}

  /* ===== INTELIGENCIA DO DIA ===== */
  .insight{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--border-soft)}
  .insight:first-child{border-top:none;padding-top:2px}
  .insight-icon{width:30px;height:30px;border-radius:8px;background:var(--bg-3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
  .insight-title{font-weight:700;font-size:13.5px}
  .insight-text{font-size:12.5px;color:var(--text-secondary);margin-top:2px;line-height:1.5}

  /* ===== AEROPORTO ===== */
  .flight-bank{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-soft);margin-top:8px;position:relative}
  .flight-bank.now{border-color:rgba(245,197,24,.4);background:rgba(245,197,24,.05)}
  .flight-window{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);width:104px;flex-shrink:0}
  .flight-bank.now .flight-window{color:var(--accent)}
  .flight-tactic{flex:1;font-size:12px;color:var(--text-secondary);line-height:1.4}
  .now-tag{display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
  .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

  /* ===== EVENT CARD ===== */
  .event-card{background:linear-gradient(180deg,var(--bg-2),var(--bg-1));border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;position:relative;border-left-width:3px}
  .event-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .event-title{font-size:16px;font-weight:800;letter-spacing:-0.01em;line-height:1.25;margin-bottom:4px}
  .event-meta{font-size:12.5px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .event-meta b{color:var(--text-primary);font-weight:600}
  .event-dot{width:3px;height:3px;border-radius:50%;background:var(--text-tertiary)}
  .event-rows{display:flex;flex-direction:column;gap:9px;padding-top:12px;border-top:1px solid var(--border-soft)}
  .event-row{display:flex;gap:10px;align-items:flex-start}
  .event-row-icon{width:26px;height:26px;border-radius:7px;background:var(--bg-3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
  .event-row-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:2px}
  .event-row-value{font-size:13px;color:var(--text-primary);line-height:1.45;font-weight:500}
  .event-tip{margin-top:12px;padding:11px 12px;border-radius:var(--radius-sm);background:rgba(245,197,24,.06);border:1px solid rgba(245,197,24,.18);font-size:12.5px;color:#F3E5AE;line-height:1.5;display:flex;gap:8px}

  /* ===== CONCURSO CARD ===== */
  .contest-card{background:linear-gradient(180deg,rgba(167,139,250,.08),var(--bg-1));border:1px solid rgba(167,139,250,.3);border-radius:var(--radius-lg);padding:16px}
  .contest-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .contest-title{font-size:16px;font-weight:800;letter-spacing:-0.01em;line-height:1.25;margin:8px 0 3px}
  .contest-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .contest-stat{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:10px 11px}
  .contest-stat .label{font-size:9px}
  .contest-stat .value-lg{font-size:16px;margin-top:3px}
  .contest-tactic{display:flex;gap:10px;padding:11px 12px;border-radius:var(--radius-sm);background:var(--bg-1);border:1px solid var(--border-soft);margin-top:8px}
  .contest-tactic-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);margin-bottom:3px;font-weight:700}

  /* ===== CALENDÁRIO ===== */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cal-month{font-size:16px;font-weight:800;letter-spacing:-0.01em;text-transform:capitalize}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-dow{font-family:var(--font-mono);font-size:9.5px;color:var(--text-tertiary);text-align:center;padding-bottom:6px;letter-spacing:.05em}
  .cal-cell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:12.5px;font-weight:700;border:1px solid transparent;color:var(--text-secondary);gap:3px}
  .cal-cell.empty{visibility:hidden}
  .cal-cell.baixa{background:rgba(59,130,246,.10);color:#9DC3FF}
  .cal-cell.media{background:rgba(245,197,24,.10);color:#F5DA8C}
  .cal-cell.alta{background:rgba(249,115,22,.13);color:#FFB27C}
  .cal-cell.explosiva{background:rgba(239,68,68,.16);color:#FF9E9E}
  .cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .cal-cell.selected{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(245,197,24,.3)}
  .cal-dots{display:flex;gap:2px;position:absolute;bottom:5px}
  .cal-dot{width:3.5px;height:3.5px;border-radius:50%;background:currentColor;opacity:.75}
  .cal-dot-concurso{background:var(--purple) !important;opacity:1}
  .cal-cell.selected .cal-dot{background:var(--accent-ink)}
  .cal-legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border-soft)}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary)}
  .legend-dot{width:8px;height:8px;border-radius:3px}

  /* ===== PAYWALL ===== */
  .paywall-card{position:relative;border-radius:var(--radius-lg);overflow:hidden;border:1px solid rgba(245,197,24,.3);background:linear-gradient(160deg,rgba(245,197,24,.09),var(--bg-1) 60%)}
  .paywall-inner{padding:22px 18px;text-align:center}
  .paywall-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(160deg,#FFD84D,var(--accent));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 20px rgba(245,197,24,.25)}
  .paywall-title{font-size:19px;font-weight:900;letter-spacing:-0.01em;margin-bottom:8px}
  .paywall-text{font-size:13.5px;color:var(--text-secondary);line-height:1.55;max-width:400px;margin:0 auto 18px}
  .locked-wrap{position:relative}
  .locked-blur{filter:blur(6px);opacity:.55;pointer-events:none;user-select:none}
  .locked-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;z-index:5}
  .lock-chip{display:flex;align-items:center;gap:6px;background:rgba(7,10,16,.85);border:1px solid rgba(245,197,24,.4);color:var(--accent);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700}

  /* ===== MODAL PLANOS ===== */
  .modal-backdrop{position:fixed;inset:0;background:rgba(3,5,9,.72);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center}
  .modal-sheet{width:100%;max-width:620px;background:var(--bg-1);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:sheetup .22s ease-out}
  @keyframes sheetup{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .modal-handle{width:36px;height:4px;border-radius:3px;background:var(--border);margin:0 auto 18px}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .plan-card{border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-top:12px;display:flex;align-items:center;gap:14px;position:relative;transition:border-color .12s ease,background .12s ease}
  .plan-card.selected{border-color:var(--accent);background:rgba(245,197,24,.06)}
  .plan-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .plan-card.selected .plan-radio{border-color:var(--accent)}
  .plan-radio-dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .plan-best{position:absolute;top:-9px;right:14px;background:var(--accent);color:var(--accent-ink);font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:999px;text-transform:uppercase}
  .plan-name{font-weight:800;font-size:14.5px}
  .plan-sub{font-size:11.5px;color:var(--text-secondary);margin-top:2px}
  .plan-price{margin-left:auto;text-align:right}
  .plan-price b{font-size:19px;font-weight:900}
  .plan-price span{display:block;font-size:10px;color:var(--text-tertiary);margin-top:1px}

  /* ===== LOADING / ERROR ===== */
  .state-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 30px;text-align:center;gap:16px;min-height:50vh}
  .scan-bar{width:180px;height:3px;background:var(--bg-3);border-radius:3px;overflow:hidden;position:relative}
  .scan-bar::after{content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 1.1s ease-in-out infinite}
  @keyframes scan{0%{left:-40%}100%{left:100%}}
  .scan-text{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;color:var(--text-secondary);min-height:16px}
  .error-icon{width:52px;height:52px;border-radius:14px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);display:flex;align-items:center;justify-content:center;color:var(--red)}

  /* ===== SECTION TITLE ===== */
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 2px}
  .section-title h2{font-size:13px;font-weight:800;letter-spacing:.02em}
  .section-title .count{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}

  .fade-in{animation:fadeIn .22s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

  .empty-note{font-size:12.5px;color:var(--text-tertiary);text-align:center;padding:18px 10px;line-height:1.5}

  @media (min-width:480px){
    .contest-grid{grid-template-columns:repeat(4,1fr)}
  }
</style>

<script>
const {
  useState,
  useEffect,
  useMemo,
  useCallback,
  useRef
} = React;

/* ════════════════════════════════════════════════════════════════════
   1. CONFIGURAÇÃO REGIONAL
   Único bloco a trocar para replicar o produto em outra praça.
   ════════════════════════════════════════════════════════════════════ */
const CONFIG_REGIONAL = {
  cidade: 'Porto Alegre',
  uf: 'RS',
  fuso: 'America/Sao_Paulo',
  moeda: 'BRL',
  aeroporto: {
    codigo: 'POA',
    nome: 'Salgado Filho'
  },
  bairros: ['Centro Histórico', 'Cidade Baixa', 'Moinhos de Vento', 'Menino Deus', 'Praia de Belas', 'Zona Sul (Ipanema/Tristeza)', 'Bela Vista', 'Auxiliadora', 'BarraShoppingSul', 'Aeroporto Salgado Filho']
};

/* ════════════════════════════════════════════════════════════════════
   2. UTILITÁRIOS DE DATA
   ════════════════════════════════════════════════════════════════════ */
const DIAS_SEMANA = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
const DIAS_ABREV = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const MESES_ABREV = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
function paraISO(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function deISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function adicionarDias(date, dias) {
  const d = new Date(date);
  d.setDate(d.getDate() + dias);
  return d;
}
// Retorna a próxima ocorrência de um dia da semana (nunca o próprio dia de hoje),
// com possibilidade de pular semanas extras — usado para projetar eventos de demo.
function proximoDiaSemana(base, diaSemanaAlvo, semanasExtra = 0) {
  const d = new Date(base);
  const diff = (diaSemanaAlvo - d.getDay() + 7) % 7 || 7;
  d.setDate(d.getDate() + diff + semanasExtra * 7);
  return d;
}
function formatarDataCurta(date) {
  return `${DIAS_ABREV[date.getDay()]}, ${date.getDate()} ${MESES_ABREV[date.getMonth()]}`;
}
function formatarDataLonga(date) {
  return `${DIAS_SEMANA[date.getDay()]}, ${date.getDate()} de ${MESES[date.getMonth()]}`;
}
function formatarHora(date) {
  return date.toLocaleTimeString('pt-BR', {
    hour: '2-digit',
    minute: '2-digit'
  });
}
function mesmoDia(a, b) {
  return paraISO(a) === paraISO(b);
}

/* ════════════════════════════════════════════════════════════════════
   3. LÓGICA DE NEGÓCIO — FUNÇÕES PURAS (testáveis, sem I/O)
   ════════════════════════════════════════════════════════════════════ */

}, {

function janelaAeroportoAtual(hora) {
  const h = hora < 6 ? hora + 24 : hora;
  const idx = BANCOS_AEROPORTO.findIndex((b, i) => {
    const [ini, fim] = b.janela.split('–').map(s => parseInt(s.split(':')[0], 10));

    return h >= ini && h < fimAj;
  });
  return idx;
}

  let nivel = BASELINE_SEMANA[date.getDay()];

function agruparEventosPorData(eventos) {
  const mapa = {};
  eventos.forEach(ev => {
    if (!mapa[ev.dataISO]) mapa[ev.dataISO] = [];
    mapa[ev.dataISO].push(ev);
  });
  return mapa;
}

function sanitizarJSON(texto) {
  const limpo = texto.replace(/```json|```/g, '').trim();
  const ini = limpo.indexOf('{');
  const fim = limpo.lastIndexOf('}');
  if (ini === -1 || fim === -1) throw new Error('Resposta sem JSON válido');
  return JSON.parse(limpo.slice(ini, fim + 1));
}
